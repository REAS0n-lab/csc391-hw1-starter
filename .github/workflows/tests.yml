# Offline checks for the HW1 starter.
#
# test_correctness.py checks the objective, the gradients, the closed-form
# solution, and that both methods converge. It passes on a fresh clone.
#
# test_costs.py is the specification for the two functions you write in
# src/costs.py. It fails until you write them, and that failure is expected on
# a fresh clone rather than a sign that something is broken.
#
# Every check here is worth zero points. A green run means the code does what
# it claims, not that the comparison you built on it is fair.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r env/requirements.txt

      - name: Starter correctness
        run: python -m pytest tests/test_correctness.py -q

      - name: End to end, small problem
        run: |
          python run_hw1.py --method rcd --scale small --repeat 2 --max-epochs 5 \
                 --out /tmp/ci.jsonl
          python scripts/plot_hw1.py /tmp/ci.jsonl -o /tmp/ci.png
          test -s /tmp/ci.png && echo "figure rendered"

      - name: Cost model
        run: python -m pytest tests/test_costs.py -q
